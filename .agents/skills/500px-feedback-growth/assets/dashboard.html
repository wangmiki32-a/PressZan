<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500px 正向反馈增长</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1e8;
      --muted: #aaa69d;
      --panel: #151718;
      --line: #303435;
      --lime: #c9ff46;
      --orange: #ff8d46;
      --cyan: #62d7e4;
      --pink: #ef6f9e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0d0e;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px);
      mix-blend-mode: soft-light;
    }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; margin-bottom: 28px; }
    .eyebrow { color: var(--lime); font: 700 12px/1 monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 6px; font-size: clamp(30px, 5vw, 64px); line-height: .98; letter-spacing: -.05em; }
    .stamp { color: var(--muted); font: 12px/1.5 monospace; text-align: right; }
    .pause { color: var(--orange); }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card, .panel { border: 1px solid var(--line); background: var(--panel); }
    .card { min-height: 138px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .label { color: var(--muted); font: 12px/1.3 monospace; text-transform: uppercase; letter-spacing: .08em; }
    .metric { font-size: clamp(28px, 4vw, 48px); line-height: 1; letter-spacing: -.05em; }
    .metric small { color: var(--muted); font-size: 15px; letter-spacing: 0; }
    .progress { height: 5px; background: #272a2b; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--lime); }
    .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; margin-top: 12px; }
    .panel { padding: 20px; min-height: 285px; }
    .panel h2 { margin: 0 0 20px; font-size: 16px; letter-spacing: -.01em; }
    .legend { display: flex; gap: 16px; color: var(--muted); font: 11px/1 monospace; }
    .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
    .chart { display: flex; align-items: end; gap: 9px; height: 190px; margin-top: 20px; overflow-x: auto; overflow-y: hidden; }
    .day { min-width: 38px; flex: 1; height: 100%; display: flex; align-items: end; gap: 3px; position: relative; padding-bottom: 25px; }
    .bar { min-height: 2px; flex: 1; background: var(--cyan); }
    .bar.feedback { background: var(--lime); }
    .day span { position: absolute; bottom: 0; left: 0; color: var(--muted); font: 9px/1 monospace; }
    .rows { display: grid; gap: 13px; }
    .row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 10px; align-items: center; font-size: 12px; }
    .track { height: 10px; background: #272a2b; }
    .fill { height: 100%; background: var(--cyan); }
    .tiers .row:nth-child(1) .fill { background: var(--lime); }
    .tiers .row:nth-child(2) .fill { background: var(--cyan); }
    .tiers .row:nth-child(3) .fill { background: var(--orange); }
    .tiers .row:nth-child(4) .fill { background: var(--pink); }
    .funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 170px; }
    .funnel > div { background: #242728; border-top: 3px solid var(--orange); padding: 10px; min-height: 46px; }
    .funnel strong { display: block; font-size: 22px; }
    .funnel small { color: var(--muted); }
    .ranking { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ranking th, .ranking td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: left; }
    .ranking th { color: var(--muted); font: 10px/1 monospace; letter-spacing: .07em; text-transform: uppercase; }
    .empty { color: var(--muted); border: 1px dashed var(--line); padding: 32px; text-align: center; }
    .history { margin-top: 12px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
    .tabs button { border: 1px solid var(--line); background: #111314; color: var(--muted); padding: 9px 13px; cursor: pointer; font: 11px/1 monospace; }
    .tabs button.active { border-color: var(--lime); color: var(--lime); }
    .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .history-item { background: #111314; border-left: 2px solid var(--line); padding: 12px; }
    .history-item strong { display: block; font-size: 20px; margin-top: 5px; }
    .details { margin-top: 12px; color: var(--muted); font: 11px/1.6 monospace; white-space: pre-wrap; }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 680px); padding-top: 28px; }
      header { grid-template-columns: 1fr; }
      .stamp { text-align: left; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
      .history-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 430px) {
      .cards { grid-template-columns: 1fr; }
      .funnel { grid-template-columns: repeat(2, 1fr); height: auto; }
      .history-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Feedback intelligence / Shanghai</div><h1>正向反馈增长</h1></div>
      <div class="stamp" id="stamp"></div>
    </header>
    <section class="cards" id="cards"></section>
    <section class="grid">
      <article class="panel"><h2>点赞与独立回馈趋势</h2><div class="legend"><span><i style="background:var(--cyan)"></i>点赞</span><span><i style="background:var(--lime)"></i>归因回馈者</span></div><div class="chart" id="trend"></div></article>
      <article class="panel"><h2>候选层级</h2><div class="rows tiers" id="tiers"></div></article>
      <article class="panel"><h2>回馈漏斗</h2><div class="funnel" id="funnel"></div></article>
      <article class="panel"><h2>反馈延迟</h2><div class="rows" id="latency"></div></article>
      <article class="panel" style="grid-column:1/-1"><h2>Verified 榜单</h2><div id="ranking"></div></article>
    </section>
    <section class="panel history"><h2>已完成的每日任务</h2><div id="history"></div></section>
  </main>
  <script>
    const data = __DASHBOARD_DATA__;
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const percent = value => value == null ? "待成熟" : `${value.toFixed(1)}%`;
    const current = data.current_task;
    document.getElementById("stamp").innerHTML = `生成 ${esc(data.generated_at)}<br><span class="${current.pause_reason ? "pause" : ""}">${current.pause_reason ? `暂停：${esc(current.pause_reason)}` : `状态：${esc(current.status)}`}</span>`;
    const metrics = [
      ["今日点赞", `${current.confirmed_likes}<small> / 100</small>`, current.confirmed_likes],
      ["今日覆盖摄影师", `${current.unique_photographers}<small> / ≥80</small>`, Math.min(100, current.unique_photographers / 80 * 100)],
      ["滚动 30 天回馈率", percent(data.kpi.value), data.kpi.value || 0],
      ["Verified 群体", `${data.verified_count}<small> 人</small>`, Math.min(100, data.verified_count * 5)],
    ];
    document.getElementById("cards").innerHTML = metrics.map(([label, value, width]) => `<article class="card"><div class="label">${label}</div><div class="metric">${value}</div><div class="progress"><i style="width:${Math.max(0, Math.min(100, width))}%"></i></div></article>`).join("");
    const maxTrend = Math.max(1, ...data.daily_trend.flatMap(item => [item.confirmed_likes, item.attributed_reciprocators]));
    document.getElementById("trend").innerHTML = data.daily_trend.length ? data.daily_trend.map(item => `<div class="day"><i class="bar" title="${item.confirmed_likes} 赞" style="height:${item.confirmed_likes/maxTrend*100}%"></i><i class="bar feedback" title="${item.attributed_reciprocators} 回馈" style="height:${item.attributed_reciprocators/maxTrend*100}%"></i><span>${esc(item.day.slice(5))}</span></div>`).join("") : `<div class="empty">暂无趋势数据</div>`;
    const renderRows = (items, labelKey) => { const max = Math.max(1, ...items.map(item => item.count)); return items.map(item => `<div class="row"><span>${esc(item[labelKey])}</span><div class="track"><div class="fill" style="width:${item.count/max*100}%"></div></div><b>${item.count}</b></div>`).join(""); };
    document.getElementById("tiers").innerHTML = renderRows(data.tier_distribution, "tier");
    document.getElementById("latency").innerHTML = renderRows(data.latency_buckets, "label");
    const maxFunnel = Math.max(1, ...data.funnel.map(item => item.count));
    document.getElementById("funnel").innerHTML = data.funnel.map(item => `<div style="height:${55 + item.count/maxFunnel*105}px"><strong>${item.count}</strong><small>${esc(item.stage)}</small></div>`).join("");
    document.getElementById("ranking").innerHTML = data.verified_ranking.length ? `<table class="ranking"><thead><tr><th>摄影师</th><th>30 天回馈</th><th>累计成功</th><th>最近观察</th></tr></thead><tbody>${data.verified_ranking.map(item => `<tr><td>${esc(item.display_name)}</td><td>${item.successes_30d}</td><td>${item.total_successes}</td><td>${esc(item.last_feedback_at || "—")}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">尚未形成 Verified 群体</div>`;
    const history = document.getElementById("history");
    if (!data.history_tabs.length) {
      history.innerHTML = `<div class="empty">当日达到 100 个确认点赞后，才会生成历史 Tab。</div>`;
    } else {
      history.innerHTML = `<div class="tabs">${data.history_tabs.map((item, index) => `<button data-index="${index}" class="${index === 0 ? "active" : ""}">${esc(item.daily_task_id)}</button>`).join("")}</div><div id="history-body"></div>`;
      const drawHistory = index => {
        const item = data.history_tabs[index];
        document.getElementById("history-body").innerHTML = `<div class="history-grid"><div class="history-item"><span class="label">覆盖摄影师</span><strong>${item.unique_photographers}</strong></div><div class="history-item"><span class="label">强化点赞</span><strong>${item.reinforcement_likes}</strong></div><div class="history-item"><span class="label">评论</span><strong>${item.confirmed_comments}</strong></div><div class="history-item"><span class="label">新增回馈者</span><strong>${item.new_reciprocators}</strong></div></div><div class="details">完成：${esc(item.completed_at)}\n配额：${esc(JSON.stringify(item.quota_counts))}\n跳过：${esc(JSON.stringify(item.skip_counts))}\n层级变化：${esc(JSON.stringify(item.tier_changes))}\n风险事件：${esc(JSON.stringify(item.risk_events))}</div>`;
      };
      history.querySelectorAll("button").forEach(button => button.addEventListener("click", () => { history.querySelectorAll("button").forEach(item => item.classList.remove("active")); button.classList.add("active"); drawHistory(Number(button.dataset.index)); }));
      drawHistory(0);
    }
  </script>
</body>
</html>
